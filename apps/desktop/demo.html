<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SYSCORA</title>
    <link rel="stylesheet" href="/demo.css" />
  </head>
  <body>
    <header class="demo-topbar">
      <div class="brand">
        <span class="logo">◆</span>
        <div>
          <h1>SYSCORA</h1>
          <p>Tell your computer what you want done.</p>
        </div>
      </div>
      <label class="debug-toggle">
        <!-- This said "Ready", in green, always — it was markup, not a reading.
             With the daemon stopped it went on saying Ready while every request
             failed, which is the worst thing a status indicator can do. It is
             now driven by /api/health. -->
        <span id="healthDot" class="status-dot" aria-hidden="true"></span>
        <span id="healthLabel">Connecting…</span>
        <input id="debugToggle" type="checkbox" />
        Developer mode
      </label>
    </header>

    <!-- Connect panel: shown only for browser-only launch (no injected token). -->
    <section id="connectPanel" class="connect-panel" hidden>
      <div class="connect-card">
        <h2>Connect to SYSCORA</h2>
        <p class="muted">Paste the API token printed in the daemon console
          (<code>SYSCORA API token: ...</code>).</p>
        <form id="connectForm">
          <input id="connectToken" type="password" autocomplete="off" placeholder="API token" required />
          <p id="connectError" class="error" hidden></p>
          <button type="submit">Connect</button>
        </form>
      </div>
    </section>

    <main class="demo-layout">
      <section id="feed" class="feed" aria-live="polite">
        <div class="welcome">
          <h2>What would you like SYSCORA to do?</h2>
          <p class="muted">Ask naturally. SYSCORA can answer, inspect, and act while keeping you
            updated in the same conversation.</p>
          <div class="suggestions" id="suggestions">
            <button class="suggestion" data-text="Tell me about this computer and what development tools are installed.">Tell me about this computer</button>
            <button class="suggestion" data-text="What's using port 3000?">What's using port 3000?</button>
            <button class="suggestion" data-text="Create a folder called Investor Demo on my Desktop and put a readme.txt inside it.">Create a folder on my Desktop</button>
            <button class="suggestion" data-text="Check if Git is installed.">Check if Git is installed</button>
            <button class="suggestion" data-text="Search WinGet for VLC.">Search for VLC</button>
            <button class="suggestion" data-text="Inspect this project and tell me what I need to run it.">Inspect this project</button>
          </div>
        </div>
      </section>

      <form id="chatForm" class="chat-bar">
        <textarea id="chatInput" rows="1" placeholder="Ask SYSCORA to do something..." required></textarea>
<!-- The "Auto-approve" checkbox that lived here is gone. The agent loop has no
         approval gate to skip, so on every request that reaches it the toggle did
         nothing at all; a control that does nothing is worse than no control,
         because the user reasonably believes it is protecting them. Requests are
         carried out as asked. The one floor that remains is below any approval and
         cannot be toggled: WindowsAdapter.executeCommand refuses commands whose
         damage no confirmation could undo. -->
        <button id="sendButton" type="submit" aria-label="Send message" title="Send (Enter)">&#8593;</button>
      </form>
    </main>

    <script src="/demo.js" type="module"></script>
  </body>
</html>
